@(title: String, request: Http.Request)(content: play.twirl.api.Html)

<!DOCTYPE html>

<html>
    <head>
        <title>@title</title>
    </head>
    <body>
        @if(request.flash().get("message").isPresent) {
          <p style="color: green;">@request.flash().get("message")</p>
        }
        @content
    </body>
</html>
